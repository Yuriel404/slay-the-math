[package]
name = "number-spire"
version = "0.3.0"
description = "数字尖塔 · Number Spire"
authors = ["Number Spire"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "number_spire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
